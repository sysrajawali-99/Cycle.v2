name: Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      # -------------------------------------------------------------
      # PROTOKOL DATA: Pemeriksaan Integritas Data Wajib Sebelum Deploy
      # -------------------------------------------------------------
      - name: Check Data Security & Integrity
        run: npm run check:data

      - name: Build application
        run: npm run build

      - name: Deploy application
        if: success()
        run: |
          echo "Deploying Rajawali Cycle application..."
          # Deploy step runs only if npm run check:data and build succeed
